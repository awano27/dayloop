[package]
name = "dayloop"
version = "0.1.0"
edition = "2021"
description = "Plan / check / close / retro loop for daily tasks. Zero-forgetting is enforced by the ledger, not by an LLM."
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ulid = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
